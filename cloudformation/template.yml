AWSTemplateFormatVersion: '2010-09-09'
Description: Go Textract API - Lambda (provided.al2) behind HTTP API (API Gateway v2)

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Deployment stage (used as a suffix for resource names)
  ApiKey:
    Type: String
    NoEcho: true
    Description: API key required by the X-API-Key header
  Env:
    Type: String
    Default: production
    Description: ENV environment variable passed to the Lambda
  Debug:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: DEBUG environment variable passed to the Lambda
  MemorySize:
    Type: Number
    Default: 512
  Timeout:
    Type: Number
    Default: 15
  LogRetentionDays:
    Type: Number
    Default: 14

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'go-textract-api-${Stage}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LambdaExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: 'arn:aws:logs:*:*:*'
              - Effect: Allow
                Action:
                  - textract:DetectDocumentText
                Resource: '*'

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/go-textract-api-${Stage}'
      RetentionInDays: !Ref LogRetentionDays

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub 'go-textract-api-${Stage}'
      Runtime: provided.al2
      Handler: bootstrap
      Code: ../bootstrap.zip
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Architectures:
        - x86_64
      Environment:
        Variables:
          API_KEY: !Ref ApiKey
          ENV: !Ref Env
          DEBUG: !Ref Debug

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'go-textract-api-${Stage}'
      ProtocolType: HTTP

  HttpApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: '2.0'

  HttpApiRouteDefault:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: $default
      Target: !Sub 'integrations/${HttpApiIntegration}'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*'

Outputs:
  ApiUrl:
    Description: HTTP API endpoint URL
    Value: !GetAtt HttpApi.ApiEndpoint
  FunctionName:
    Description: Lambda function name
    Value: !Ref ApiFunction
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ApiFunction.Arn
