version: "3"

vars:
  SERVER_PORT: "8080"
  BINARY_NAME: "go-textract-api"
  LAMBDA_BINARY: "bootstrap"
  LAMBDA_ZIP: "bootstrap.zip"
  STACK_PREFIX: "go-textract-api"
  CF_TEMPLATE: "cloudformation/template.yml"
  CF_PACKAGED_TEMPLATE: "cloudformation/template.packaged.yml"

tasks:
  run:
    desc: Run the API server locally
    env:
      API_KEY: "{{.API_KEY | default \"dev-api-key\"}}"
      PORT: "{{.SERVER_PORT}}"
    cmds:
      - go run ./cmd/api/main.go

  dev:
    desc: Run with hot reload using air
    cmds:
      - air

  build:
    desc: Build the binary
    cmds:
      - go build -ldflags='-s' -o bin/{{.BINARY_NAME}} ./cmd/api

  build:lambda:
    desc: Build for AWS Lambda
    cmds:
      - GOOS=linux GOARCH=amd64 go build -ldflags='-s -w' -o {{.LAMBDA_BINARY}} ./cmd/lambda

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  test:coverage:
    desc: Run tests with coverage
    cmds:
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  test:e2e:
    desc: Run end-to-end tests with real PDF files
    cmds:
      - go test -v ./tests -tags=e2e

  fmt:check:
    desc: Check Go code formatting
    cmds:
      - test -z "$(gofmt -l .)"

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run

  mod:
    desc: Download and tidy Go modules
    cmds:
      - go mod download
      - go mod tidy

  mod:update:
    desc: Update Go modules
    cmds:
      - go get -u ./...
      - go mod tidy

  mod:verify:
    desc: Verify Go module dependencies
    cmds:
      - go mod verify

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -w -s .

  vuln:check:
    desc: Check for vulnerabilities using govulncheck
    deps: [docs]
    cmds:
      - govulncheck ./...
    preconditions:
      - sh: command -v govulncheck
        msg: "govulncheck is not installed. Please run: go install golang.org/x/vuln/cmd/govulncheck@latest"

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
      - rm -f {{.LAMBDA_BINARY}}
      - rm -f {{.LAMBDA_ZIP}}
      - rm -f {{.CF_PACKAGED_TEMPLATE}}
      - rm -f coverage.out

  docs:
    desc: Generate Swagger documentation
    cmds:
      - swag init -g cmd/lambda/main.go -o docs/

  docs:fmt:
    desc: Format swagger comments
    cmds:
      - swag fmt -g cmd/lambda/main.go

  docs:serve:
    desc: Serve Swagger documentation UI
    deps: [docs]
    cmds:
      - go run ./cmd/docs/main.go

  cf:package:
    desc: Build the Lambda binary, zip it, and upload via `aws cloudformation package`
    dotenv: ['.env']
    deps: [build:lambda]
    vars:
      STAGE: '{{.STAGE | default "dev"}}'
      REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - zip -j {{.LAMBDA_ZIP}} {{.LAMBDA_BINARY}}
      - |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        ARTIFACT_BUCKET="${ARTIFACT_BUCKET:-{{.STACK_PREFIX}}-artifacts-${ACCOUNT_ID}-{{.REGION}}}"
        if ! aws s3api head-bucket --bucket "$ARTIFACT_BUCKET" --region {{.REGION}} 2>/dev/null; then
          aws s3 mb "s3://$ARTIFACT_BUCKET" --region {{.REGION}}
        fi
        aws cloudformation package \
          --template-file {{.CF_TEMPLATE}} \
          --s3-bucket "$ARTIFACT_BUCKET" \
          --output-template-file {{.CF_PACKAGED_TEMPLATE}} \
          --region {{.REGION}}

  cf:deploy:
    desc: Deploy the stack via CloudFormation
    dotenv: ['.env']
    deps: [cf:package]
    vars:
      STAGE: '{{.STAGE | default "dev"}}'
      REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - |
        if [ -z "${API_KEY:-}" ]; then
          echo "API_KEY is required (set it in .env or export it)" >&2
          exit 1
        fi
        aws cloudformation deploy \
          --template-file {{.CF_PACKAGED_TEMPLATE}} \
          --stack-name {{.STACK_PREFIX}}-{{.STAGE}} \
          --parameter-overrides \
              Stage={{.STAGE}} \
              ApiKey="$API_KEY" \
              Env="${ENV:-production}" \
              Debug="${DEBUG:-false}" \
          --capabilities CAPABILITY_NAMED_IAM \
          --region {{.REGION}} \
          --no-fail-on-empty-changeset
      - aws cloudformation describe-stacks --stack-name {{.STACK_PREFIX}}-{{.STAGE}} --region {{.REGION}} --query 'Stacks[0].Outputs' --output table

  cf:remove:
    desc: Delete the CloudFormation stack
    dotenv: ['.env']
    vars:
      STAGE: '{{.STAGE | default "dev"}}'
      REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - aws cloudformation delete-stack --stack-name {{.STACK_PREFIX}}-{{.STAGE}} --region {{.REGION}}
      - aws cloudformation wait stack-delete-complete --stack-name {{.STACK_PREFIX}}-{{.STAGE}} --region {{.REGION}}

  cf:logs:
    desc: Tail CloudWatch logs for the Lambda
    dotenv: ['.env']
    vars:
      STAGE: '{{.STAGE | default "dev"}}'
      REGION: '{{.REGION | default "us-west-1"}}'
    cmds:
      - aws logs tail /aws/lambda/{{.STACK_PREFIX}}-{{.STAGE}} --follow --region {{.REGION}}

  deploy:
    desc: Deploy to AWS via CloudFormation (alias for cf:deploy)
    deps: [cf:deploy]

  logs:
    desc: Tail Lambda logs (alias for cf:logs)
    deps: [cf:logs]

  default:
    desc: Default task (format, test, build)
    deps: [fmt, test, build]
